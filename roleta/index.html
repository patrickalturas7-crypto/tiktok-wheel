<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weapons of War : Awakening</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; }
        body { background: #050505; min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; padding: 8px; }
        
        .app { 
            max-width: 1100px; width: 100%; 
            background-color: rgba(15, 15, 18, 0.85); /* Slight transparency to see bg image */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            backdrop-filter: blur(10px); 
            border-radius: 28px; padding: 16px 18px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.9), inset 0 1px 3px rgba(255, 255, 255, 0.1); 
            border: 2px solid transparent; background-clip: padding-box; 
            position: relative; overflow: hidden; 
            transition: background 0.5s ease;
        }
        .app::before { content: ""; position: absolute; inset: -2px; z-index: -1; background: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ff0000); background-size: 400%; animation: rgbBorder 6s linear infinite; border-radius: 30px; opacity: 0.5; filter: blur(4px); }
        @keyframes rgbBorder { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .login-bar { display: flex; gap: 10px; background: #0a0a0a; padding: 10px 15px; border-radius: 20px; margin-bottom: 15px; border: 1px solid #333; align-items: center; justify-content: center; position: relative; z-index: 2; }
        .login-bar input { background: #111; border: 1px solid #555; border-radius: 10px; padding: 8px 12px; color: #fff; outline: none; width: 220px; }
        .login-bar button { background: #00ffff; color: #000; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .login-bar button:hover { background: #00cccc; }
        .login-bar button:disabled { background: #555; cursor: not-allowed; color: #aaa; }
        .login-bar .status { font-weight: bold; color: #ff4444; min-width: 110px; text-align: right; }
        .login-bar .status.connected { color: #00ff00; }
        .login-bar .status.connecting { color: #ffcc00; }

        .hero-banner { width: 100%; max-height: 160px; overflow: hidden; border-radius: 20px; margin-bottom: 10px; border: 1px solid rgba(0, 255, 255, 0.3); box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 18px rgba(0, 255, 255, 0.2); position: relative; z-index: 1; }
        .hero-banner img { width: 100%; height: 160px; object-fit: cover; object-position: center 30%; display: block; filter: brightness(0.85) saturate(1.2); }
        .hero-banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(15,15,18,0.0) 40%, rgba(15,15,18,0.85) 100%); pointer-events: none; }

        h1 { text-align: center; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; font-size: 1.5rem; margin: 0 0 12px 0; color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(0, 255, 255, 0.5); position: relative; z-index: 1; }
        h1 .accent { color: #00ffff; text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff; }

        .main-panel { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; position: relative; z-index: 1; }
        .wheel-container { position: relative; flex: 1 1 300px; display: flex; justify-content: center; align-items: center; min-width: 240px; }
        canvas { width: 100%; max-width: 340px; height: auto; aspect-ratio: 1/1; display: block; filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.3)); border-radius: 50%; }
        .pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 30px solid #00ffff; filter: drop-shadow(0 0 8px #00ffff) drop-shadow(0 4px 4px black); z-index: 10; pointer-events: none; }

        .notification-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.85); border: 2px solid #ff00ff; box-shadow: 0 0 20px #ff00ff, inset 0 0 20px #ff00ff; padding: 15px 30px; border-radius: 15px; text-align: center; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease; }
        .notification-overlay.show { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        .notification-label { font-size: 0.8rem; color: #00ffff; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .notification-name { font-size: 1.8rem; font-weight: 900; color: #fff; text-shadow: 0 0 10px #fff; word-break: break-word; }

        .winner-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; pointer-events: none; z-index: 20; opacity: 0; transition: opacity 0.3s ease; text-align: center; }
        .winner-overlay.show { opacity: 1; pointer-events: auto; }

        .overlay-timer { font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 0 12px #ff00ff, 0 0 24px #ff00ff, 0 2px 4px #000; white-space: nowrap; display: none; }
        .overlay-timer.show { display: block; }

        .overlay-name { font-size: 2.2rem; font-weight: 900; color: #ffffff; text-shadow: 0 0 12px #00ffff, 0 0 26px #00ffff, 0 3px 6px #000; line-height: 1.05; word-break: break-word; animation: namePulse 0.7s infinite alternate; display: none; }
        .overlay-name.show { display: block; }
        
        @keyframes namePulse { from { transform: scale(1); text-shadow: 0 0 12px #00ffff, 0 0 26px #00ffff, 0 3px 6px #000; } to { transform: scale(1.05); text-shadow: 0 0 18px #ffffff, 0 0 36px #00ffff, 0 3px 8px #000; } }

        .winner-actions { display: none; gap: 10px; margin-top: 10px; pointer-events: auto; }
        .winner-actions.show { display: flex; }
        
        .action-btn { padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; cursor: pointer; border: none; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
        .btn-keep { background: linear-gradient(135deg, #00ff00 0%, #008800 100%); color: #000; box-shadow: 0 4px 0 #005500, 0 0 10px #00ff0088; }
        .btn-keep:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .btn-reroll { background: linear-gradient(135deg, #ff00ff 0%, #880088 100%); color: #fff; box-shadow: 0 4px 0 #440044, 0 0 10px #ff00ff88; }
        .btn-reroll:hover { filter: brightness(1.2); transform: translateY(-2px); }

        .chat-prompt { display: none; font-size: 0.85rem; color: #aaffaa; background: rgba(0, 255, 0, 0.1); padding: 4px 10px; border-radius: 10px; border: 1px solid #00ff00; margin-top: 5px; animation: promptPulse 1.5s infinite alternate; }
        .chat-prompt.show { display: block; }
        @keyframes promptPulse { from { opacity: 0.7; box-shadow: 0 0 5px #00ff00; } to { opacity: 1; box-shadow: 0 0 15px #00ff00; } }

        #confettiCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; border-radius: 50%; }

        .controls { flex: 1 1 300px; display: flex; flex-direction: column; gap: 10px; }

        .input-row { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; position: relative; }
        .input-row input[type="text"] { flex: 0 1 140px; width: 140px; background: #111; border: 1px solid #333; border-radius: 40px; padding: 10px 14px; color: #fff; outline: none; }
        
        .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; cursor: pointer; border: none; transition: 0.2s; flex-shrink: 0; }
        .spin-now-btn { background: #00ffff; color: #000; }
        .shuffle-btn { background: #ff00ff; color: #fff; }
        .theme-btn { background: #ffcc00; color: #000; }

        .name-list-box { background: #0a0a0a; border-radius: 18px; padding: 10px 12px; border: 1px solid #222; max-height: 150px; overflow-y: auto; }
        .name-list-header { display: flex; justify-content: space-between; align-items: center; color: #ccc; padding-bottom: 5px; border-bottom: 1px dashed #333; margin-bottom: 6px; font-weight: 600; }
        .count-badge { background: #00ffff; color: #000; padding: 1px 8px; border-radius: 20px; }
        .count-badge.green { background: #00ff00; }
        .clear-btn { background: transparent; border: 1px solid #555; color: #aaa; border-radius: 20px; padding: 2px 10px; font-size: 0.7rem; cursor: pointer; }
        .names-grid { display: flex; flex-wrap: wrap; gap: 5px; }
        .name-tag { background: #1a1a1a; border-radius: 30px; padding: 4px 8px 4px 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #eee; border: 1px solid #333; }
        .name-tag .remove-name { background: #333; border: none; color: #aaa; width: 18px; height: 18px; border-radius: 50%; cursor: pointer; }
        .winner-tag { background: rgba(0, 255, 0, 0.1); border: 1px solid rgba(0, 255, 0, 0.3); color: #aaffaa; border-radius: 30px; padding: 4px 12px; font-size: 0.85rem; font-weight: bold; }

        .control-panel { background: #0a0a0a; border-radius: 16px; padding: 12px; border-left: 4px solid #00ffff; display: flex; flex-direction: column; gap: 8px; position: relative; }
        
        .control-panel label { color: #ccc; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
        .control-panel input[type="number"] { width: 60px; background: #111; border: 1px solid #333; color: #fff; padding: 4px; border-radius: 5px; text-align: center; }
        .master-btn { padding: 10px; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; border: none; margin-top: 5px; transition: 0.2s; }
        .btn-start { background: #00ff00; color: #000; }
        .btn-start:hover { background: #00cc00; }
        .btn-stop { background: #ff0000; color: #fff; }
        .btn-stop:hover { background: #cc0000; }
        
        .timer-display { display: flex; justify-content: space-between; color: #fff; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        
        .cooldown-btn { background: #ff00ff; color: white; padding: 6px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; border: none; cursor: pointer; margin-top: 5px; display: none; }
        .cooldown-btn.show { display: block; }
        
        .spin-inputs { display: flex; gap: 5px; align-items: center; }
    </style>
</head>
<body>
<!-- Added ID for background changing -->
<div class="app" id="mainApp">
    
    <div class="login-bar">
        <span class="status" id="tiktokStatus">🔴 Disconnected</span>
        <input type="text" id="tiktokUser" placeholder="Enter TikTok Username">
        <button id="connectBtn">Connect to Live</button>
    </div>

    <div class="hero-banner">
        <img src="/static/banner.jpg" alt="Weapons of War: Awakening">
    </div>
    <h1>Weapons <span class="accent">of</span> War <span class="accent">:</span> Awakening</h1>
    
    <div class="main-panel">
        <div class="wheel-container">
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
            <canvas id="confettiCanvas" width="600" height="600"></canvas>
            <div class="pointer"></div>
            
            <div class="notification-overlay" id="notifyOverlay">
                <div class="notification-label">User Notified</div>
                <div class="notification-name" id="notifyName">—</div>
            </div>

            <div class="winner-overlay" id="winnerOverlay">
                <div class="overlay-timer" id="overlayTimer">--</div>
                <div class="overlay-name" id="overlayName">—</div>
                
                <div class="winner-actions" id="winnerActions">
                    <button class="action-btn btn-reroll" id="rerollBtn">🔄 Re-roll</button>
                    <button class="action-btn btn-keep" id="keepBtn">🏆 Keep</button>
                </div>
                <div class="chat-prompt" id="chatPrompt">Type <b>!present [name]</b> in chat</div>
            </div>
        </div>

        <div class="controls">
            <div class="input-row">
                <input type="text" id="nameInput" placeholder="Enter name..." maxlength="40">
                
                <!-- Hidden file input for the wheel image -->
                <input type="file" id="bgUpload" accept="image/*" style="display: none;">
                
                <!-- Moved Theme Button Here -->
                <button class="icon-btn theme-btn" id="themeBtn" title="Upload Wheel Image">🎨</button>
                <button class="icon-btn shuffle-btn" id="shuffleBtn" title="Shuffle Wheel">🔀</button>
                <button class="icon-btn spin-now-btn" id="spinNowBtn" title="Manual Spin">⚔️</button>
            </div>

            <div class="name-list-box">
                <div class="name-list-header">
                    <span>⚔️ weapons in wheel <span class="count-badge" id="nameCount">0</span></span>
                    <button class="clear-btn" id="clearAllBtn">clear all</button>
                </div>
                <div id="namesGrid" class="names-grid"></div>
            </div>

            <div class="name-list-box">
                <div class="name-list-header">
                    <span>🏆 winners kept <span class="count-badge green" id="winnerCount">0</span></span>
                    <button class="clear-btn" id="clearWinnersBtn">clear winners</button>
                </div>
                <div id="winnersGrid" class="names-grid"></div>
            </div>

            <div class="control-panel">
                <div class="timer-display">
                    <span>⏱️ Next Spin: <span id="nextSpinTimer">--:--</span></span>
                    <span>🎯 Cooldown: <span id="spinCooldown">--</span></span>
                </div>
                
                <label>
                    Spin Interval:
                    <div class="spin-inputs">
                        <input type="number" id="spinIntervalMins" value="30" min="0"> m
                        <input type="number" id="spinIntervalSecs" value="0" min="0" max="59"> s
                    </div>
                </label>

                <button class="master-btn btn-start" id="masterStartBtn">▶ START ROLETA</button>
                <button class="master-btn btn-stop" id="masterStopBtn" style="display:none;">⏹ STOP ROLETA</button>
                
                <button class="cooldown-btn" id="stopCooldownBtn">⏹️ Skip Cooldown & Spin Now</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        let names = [];
        let winners = [];
        
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const namesGrid = document.getElementById('namesGrid');
        const winnersGrid = document.getElementById('winnersGrid');
        const nameInput = document.getElementById('nameInput');
        const nameCountSpan = document.getElementById('nameCount');
        const winnerCountSpan = document.getElementById('winnerCount');
        const nextSpinTimerSpan = document.getElementById('nextSpinTimer');
        const spinCooldownSpan = document.getElementById('spinCooldown');
        const overlayName = document.getElementById('overlayName');
        const overlayTimer = document.getElementById('overlayTimer');
        const winnerOverlay = document.getElementById('winnerOverlay');
        const winnerActions = document.getElementById('winnerActions');
        const chatPrompt = document.getElementById('chatPrompt');
        const rerollBtn = document.getElementById('rerollBtn');
        const keepBtn = document.getElementById('keepBtn');
        const stopCooldownBtn = document.getElementById('stopCooldownBtn');

        const notifyOverlay = document.getElementById('notifyOverlay');
        const notifyName = document.getElementById('notifyName');
        let notifyTimeout = null;

        let isSpinning = false;
        let isRoletaRunning = false;
        let idleAngle = 0;
        let lastRenderedAngle = 0;
        let nextSpinTimestamp = Infinity;
        let cooldownEndTimestamp = null;
        let currentWinner = null;
        let spinDuration = 60000;
        let idleSpinSpeed = 0.005; 
        
        let ws;
        const tiktokStatus = document.getElementById('tiktokStatus');
        const tiktokUser = document.getElementById('tiktokUser');
        const connectBtn = document.getElementById('connectBtn');

        // --- THEME & UPLOAD LOGIC ---
        const themeBtn = document.getElementById('themeBtn');
        const bgUpload = document.getElementById('bgUpload');
        const mainApp = document.getElementById('mainApp');

        // When theme button is clicked, open file dialog
        themeBtn.onclick = () => {
            bgUpload.click();
        };

        // Wheel image (drawn inside the roleta, rotates with it)
        let wheelImage = null;
        let wheelImageURL = null;
        const SLICE_ALPHA = 0.3; // color tint over the image (0 = none, 1 = solid)

        // When a file is selected, load it onto the wheel
        bgUpload.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (wheelImageURL) URL.revokeObjectURL(wheelImageURL);
            wheelImageURL = URL.createObjectURL(file);

            const img = new Image();
            img.onload = () => {
                wheelImage = img;
                drawWheel(lastRenderedAngle);
            };
            img.src = wheelImageURL;

            themeBtn.textContent = "❌";
            themeBtn.title = "Remove Wheel Image";

            themeBtn.onclick = () => {
                wheelImage = null;
                if (wheelImageURL) URL.revokeObjectURL(wheelImageURL);
                wheelImageURL = null;
                drawWheel(lastRenderedAngle);

                themeBtn.textContent = "🎨";
                themeBtn.title = "Upload Wheel Image";
                themeBtn.onclick = () => bgUpload.click();
                bgUpload.value = "";
            };
        };
        // ----------------------------

        // Shuffle Logic
        document.getElementById('shuffleBtn').onclick = () => {
            if (isSpinning) return;
            for (let i = names.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [names[i], names[j]] = [names[j], names[i]];
            }
            updateUI();
            drawWheel(lastRenderedAngle);
        };

        let audioCtx = null;
        function ensureAudio() {
            if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
        }
        function playKeepSound() {
            const ac = ensureAudio(); if (!ac) return;
            const now = ac.currentTime;
            [523.25, 659.25, 783.99].forEach((freq, idx) => {
                const osc = ac.createOscillator(); const gain = ac.createGain();
                osc.type = 'triangle'; const t = now + idx * 0.09;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0.14, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
                osc.connect(gain); gain.connect(ac.destination);
                osc.start(t); osc.stop(t + 0.2);
            });
        }

        function showNotification(name) {
            notifyName.textContent = name;
            notifyOverlay.classList.add('show');
            if (notifyTimeout) clearTimeout(notifyTimeout);
            notifyTimeout = setTimeout(() => {
                notifyOverlay.classList.remove('show');
            }, 5000);
        }

        function init() {
            updateUI();
            drawWheel(0);
            
            nameInput.addEventListener('keydown', e => { if(e.key === 'Enter') addName(); });
            document.getElementById('spinNowBtn').onclick = () => { if(!isSpinning && names.length > 0) performSpin(); };
            
            document.getElementById('clearAllBtn').onclick = () => { 
                names = []; 
                updateUI(); 
                drawWheel(0); 
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ action: "clear_all" }));
                }
            };
            document.getElementById('clearWinnersBtn').onclick = () => { winners = []; updateUI(); };
            
            rerollBtn.onclick = () => { hideWinnerOverlay(); performSpin(); };
            keepBtn.onclick = () => { keepWinner(currentWinner); };
            
            stopCooldownBtn.onclick = () => {
                cooldownEndTimestamp = null; 
                stopCooldownBtn.classList.remove('show');
                hideWinnerOverlay();
                performSpin(); 
            };
            
            document.getElementById('masterStartBtn').onclick = () => {
                isRoletaRunning = true;
                document.getElementById('masterStartBtn').style.display = 'none';
                document.getElementById('masterStopBtn').style.display = 'block';
                
                const mins = parseInt(document.getElementById('spinIntervalMins').value) || 0;
                const secs = parseInt(document.getElementById('spinIntervalSecs').value) || 0;
                const totalMs = (mins * 60 * 1000) + (secs * 1000);
                
                nextSpinTimestamp = Date.now() + totalMs;
            };

            document.getElementById('masterStopBtn').onclick = () => {
                isRoletaRunning = false;
                document.getElementById('masterStopBtn').style.display = 'none';
                document.getElementById('masterStartBtn').style.display = 'block';
                nextSpinTimestamp = Infinity;
                nextSpinTimerSpan.textContent = "PAUSED";
            };

            connectBtn.onclick = () => {
                const user = tiktokUser.value.trim().replace("@", "");
                if (!user) return alert("Enter a TikTok username first!");
                if (!ws || ws.readyState !== WebSocket.OPEN) return alert("Bridge offline!");
                
                connectBtn.disabled = true;
                connectBtn.textContent = "Connecting...";
                tiktokStatus.textContent = `🟡 Connecting...`;
                tiktokStatus.className = "status connecting";
                ws.send(JSON.stringify({ action: "connect_tiktok", username: user }));
            };

            connectToPython();
            requestAnimationFrame(mainLoop);
        }

        function addName(nameFromExt = null) {
            let raw = nameFromExt !== null ? nameFromExt.trim() : nameInput.value.trim();
            if (!raw) return;
            if (names.some(n => n.toLowerCase() === raw.toLowerCase())) {
                if (!nameFromExt) alert("Name already in wheel!"); 
                return;
            }
            if (names.length >= 24) {
                if (!nameFromExt) alert("Max 24 names!");
                return;
            }
            
            names.push(raw);
            if (!nameFromExt) { nameInput.value = ""; nameInput.focus(); }
            updateUI();
            drawWheel(lastRenderedAngle);
            if (!currentWinner && !isSpinning) showIdleLabel();
        }

        function keepWinner(nameToKeep) {
            if (!nameToKeep) return;
            const idx = names.findIndex(n => n.toLowerCase() === nameToKeep.toLowerCase());
            if (idx !== -1) {
                const actualName = names[idx];
                names.splice(idx, 1);
                winners.push(actualName);
                updateUI();
                drawWheel(lastRenderedAngle);
                playKeepSound();
                hideWinnerOverlay();
                if (!isSpinning && names.length > 0) showIdleLabel();
            }
        }

        function performSpin() {
            if (names.length === 0) return;
            isSpinning = true;
            hideWinnerOverlay();
            
            const startAngle = idleAngle;
            const winnerIndex = Math.floor(Math.random() * names.length);
            const angleStep = (Math.PI * 2) / names.length;
            const sliceCenter = winnerIndex * angleStep + angleStep / 2;
            
            let neededRotation = -Math.PI / 2 - sliceCenter;
            while (neededRotation < startAngle) neededRotation += 2 * Math.PI;
            
            const extraSpins = 80 + Math.floor(Math.random() * 40);
            const targetAngle = neededRotation + extraSpins * 2 * Math.PI;
            
            const spinStartTime = performance.now();
            const selectedWinner = names[winnerIndex];

            function animate(now) {
                const elapsed = now - spinStartTime;
                const progress = Math.min(elapsed / spinDuration, 1);
                
                let eased = 1 - Math.pow(1 - progress, 3); 
                if (progress > 0.75) eased = (progress - 0.75) * 4 * 0.05 + 0.95; 

                idleAngle = startAngle + (targetAngle - startAngle) * eased;
                lastRenderedAngle = idleAngle;
                drawWheel(idleAngle);
                overlayName.textContent = getNameAtPointer(idleAngle) || "—";

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    currentWinner = selectedWinner;
                    cooldownEndTimestamp = Date.now() + (2 * 60 * 1000);
                    
                    overlayName.textContent = currentWinner;
                    overlayName.classList.add('show'); 
                    overlayTimer.textContent = "02:00";
                    overlayTimer.classList.add('show');
                    winnerOverlay.classList.add('show');
                    
                    winnerActions.classList.add('show');
                    chatPrompt.classList.add('show');
                    stopCooldownBtn.classList.add('show'); 
                    
                    if (isRoletaRunning) {
                        const mins = parseInt(document.getElementById('spinIntervalMins').value) || 0;
                        const secs = parseInt(document.getElementById('spinIntervalSecs').value) || 0;
                        const totalMs = (mins * 60 * 1000) + (secs * 1000);
                        nextSpinTimestamp = Date.now() + totalMs;
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        function hideWinnerOverlay() {
            winnerOverlay.classList.remove('show');
            overlayTimer.classList.remove('show');
            winnerActions.classList.remove('show');
            chatPrompt.classList.remove('show');
            overlayName.classList.remove('show'); 
            stopCooldownBtn.classList.remove('show');
            currentWinner = null;
        }

        function showIdleLabel() {
            winnerOverlay.classList.remove('show');
            overlayTimer.classList.remove('show');
            winnerActions.classList.remove('show');
            chatPrompt.classList.remove('show');
            overlayName.classList.remove('show');
            stopCooldownBtn.classList.remove('show');
        }

        function updateUI() {
            nameCountSpan.textContent = names.length;
            winnerCountSpan.textContent = winners.length;
            
            namesGrid.innerHTML = names.map((n, i) => `
                <div class="name-tag">${n} <button class="remove-name" onclick="removeName(${i})">✕</button></div>
            `).join('');
            
            winnersGrid.innerHTML = winners.map(n => `
                <div class="winner-tag">🏆 ${n}</div>
            `).join('');
        }

        window.removeName = function(idx) {
            names.splice(idx, 1);
            updateUI();
            drawWheel(lastRenderedAngle);
        }

        function mainLoop() {
            const now = Date.now();
            
            if (isRoletaRunning && names.length > 0 && !isSpinning && now >= nextSpinTimestamp) {
                performSpin();
            }
            
            if (isRoletaRunning && nextSpinTimestamp > now) {
                const diff = nextSpinTimestamp - now;
                const mins = Math.floor(diff / 60000);
                const secs = Math.floor((diff % 60000) / 1000);
                nextSpinTimerSpan.textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
            } else if (!isRoletaRunning) {
                nextSpinTimerSpan.textContent = "PAUSED";
            }

            if (cooldownEndTimestamp && now < cooldownEndTimestamp) {
                const diff = cooldownEndTimestamp - now;
                spinCooldownSpan.textContent = `${Math.floor(diff / 60000)}:${Math.floor((diff % 60000) / 1000).toString().padStart(2,'0')}`;
                if (winnerOverlay.classList.contains('show') && overlayTimer.classList.contains('show')) {
                    overlayTimer.textContent = spinCooldownSpan.textContent;
                }
            } else {
                spinCooldownSpan.textContent = "--";
            }

            if (!isSpinning && !winnerOverlay.classList.contains('show') && names.length > 0) {
                idleAngle = (idleAngle + idleSpinSpeed) % (2 * Math.PI);
                lastRenderedAngle = idleAngle;
                drawWheel(idleAngle);
            }

            requestAnimationFrame(mainLoop);
        }

        function getNameAtPointer(angle) {
            if (!names.length) return null;
            const step = (Math.PI * 2) / names.length;
            let rel = -Math.PI / 2 - angle;
            rel = ((rel % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
            return names[Math.floor(rel / step) % names.length];
        }

        function drawWheelImage(cx, cy, r, rotation) {
            const iw = wheelImage.naturalWidth, ih = wheelImage.naturalHeight;
            const scale = (r * 2) / Math.min(iw, ih); // cover the circle
            const dw = iw * scale, dh = ih * scale;
            ctx.save();
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.clip();
            ctx.translate(cx, cy); ctx.rotate(rotation);
            ctx.drawImage(wheelImage, -dw / 2, -dh / 2, dw, dh);
            ctx.restore();
        }

        function drawWheel(offset) {
            const w = canvas.width; const h = canvas.height;
            const cx = w/2; const cy = h/2; const r = Math.min(w,h)*0.42;
            const hasImg = !!(wheelImage && wheelImage.complete && wheelImage.naturalWidth > 0);
            ctx.clearRect(0,0,w,h);
            
            if (!names.length) {
                ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI);
                ctx.fillStyle = '#111'; ctx.fill();
                if (hasImg) drawWheelImage(cx, cy, r, 0);
                ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI);
                ctx.strokeStyle = '#333'; ctx.lineWidth = 6; ctx.stroke();
                ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline='middle';
                if (hasImg) { ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText('add name', cx, cy); ctx.fillStyle = '#fff'; }
                else { ctx.fillStyle = '#666'; }
                ctx.fillText('add name', cx, cy);
                return;
            }

            if (hasImg) drawWheelImage(cx, cy, r, offset);

            const step = (Math.PI * 2) / names.length;
            const colors = ['#ff0000','#00ff00','#0000ff','#00ffff','#ff00ff','#ffff00'];

            for (let i=0; i<names.length; i++) {
                const start = i*step + offset;
                const end = start + step;
                ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,end); ctx.closePath();
                ctx.save();
                if (hasImg) ctx.globalAlpha = SLICE_ALPHA;
                ctx.fillStyle = colors[i % colors.length]; ctx.fill();
                ctx.restore();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

                const mid = start + step/2;
                const tx = cx + Math.cos(mid) * (r*0.7);
                const ty = cy + Math.sin(mid) * (r*0.7);
                ctx.save(); ctx.translate(tx,ty); ctx.rotate(mid + (mid > Math.PI/2 ? Math.PI : 0));
                ctx.font = `bold ${Math.max(12, 38 - names.length)}px sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                
                let displayName = names[i];
                if (displayName.length > 15) displayName = displayName.substring(0, 14) + '...';
                if (hasImg) { ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.strokeText(displayName, 0, 0); }
                ctx.fillStyle = '#fff';
                ctx.fillText(displayName, 0, 0); ctx.restore();
            }

            ctx.beginPath(); ctx.arc(cx,cy,r*0.16,0,2*Math.PI);
            ctx.fillStyle = '#0a0a0a'; ctx.shadowBlur = 15; ctx.shadowColor = '#00ffff'; ctx.fill();
            ctx.shadowBlur = 0; ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3; ctx.stroke();
        }

        function connectToPython() {
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(`${protocol}${window.location.host}/ws`);
            
            ws.onopen = () => { console.log("Connected to Python bridge"); };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.status === "connecting") {
                    tiktokStatus.textContent = `🟡 Connecting...`;
                    tiktokStatus.className = "status connecting";
                } else if (data.status === "connected") {
                    tiktokStatus.textContent = `🟢 Connected`;
                    tiktokStatus.className = "status connected";
                    connectBtn.disabled = false;
                    connectBtn.textContent = "Connect to Live";
                } else if (data.status === "error") {
                    tiktokStatus.textContent = `🔴 Error`;
                    tiktokStatus.className = "status";
                    connectBtn.disabled = false;
                    connectBtn.textContent = "Connect to Live";
                    alert("TikTok Connection Error: " + data.message);
                }
                
                if (data.action === 'add_name') addName(data.name);
                if (data.action === 'add_winner') keepWinner(data.name);
                if (data.action === 'show_notification') showNotification(data.name);
            };
            ws.onclose = () => {
                tiktokStatus.textContent = `🔴 Bridge Offline`;
                tiktokStatus.className = "status";
                connectBtn.disabled = false;
                connectBtn.textContent = "Connect to Live";
                setTimeout(connectToPython, 3000);
            };
        }

        init();
    })();
</script>
